name: Prod Deployment

on:
    branches:
      - main

jobs:
  deploy-to-prod:
    if: github.event.pull_request.merged == true
    runs-on: [self-hosted, Windows, X64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Power Platform Tools
      uses: microsoft/powerplatform-actions/actions-install@v1
      
    - name: Create output directory
      run: mkdir out

    - name: Find Latest UAT Deployment Run
      id: find_uat_run
      run: |
        $headers = @{
          'Authorization' = "Bearer ${{ secrets.GITHUB_TOKEN }}"
          'Accept' = 'application/vnd.github.v3+json'
        }
        
        $repo = "${{ github.repository }}"
        $baseUri = "https://api.github.com/repos/$repo/actions/workflows/UAT_Deployment.yml/runs?status=completed&conclusion=success&per_page=1"
        
        # First, try with all filters
        $queryParams = @(
          "status=completed"
          "conclusion=success"
          "per_page=5"
        )
        $fullUri = "$baseUri`?$($queryParams -join '&')"
        
        Write-Host "Fetching successful UAT runs from: $fullUri"
        
        try {
          $response = Invoke-RestMethod -Uri $fullUri -Headers $headers -Method Get
          
          Write-Host "Total runs found: $($response.workflow_runs.Count)"
          if ($response.workflow_runs) {
            foreach ($run in $response.workflow_runs) {
              Write-Host "  - Run ID: $($run.id), Branch: $($run.head_branch), Status: $($run.status), Conclusion: $($run.conclusion)"
            }
          }
          
          # Filter for successful runs on UAT branch
          $uatRuns = @($response.workflow_runs | Where-Object { $_.head_branch -eq "UAT" -and $_.conclusion -eq "success" })
          
          if ($uatRuns.Count -gt 0) {
            $latestRun = $uatRuns[0]
            $runId = $latestRun.id
            Write-Host "Latest successful UAT Run ID: $runId"
            echo "run_id=$runId" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No successful UAT runs found"
            Write-Host "Available successful runs: $($response.workflow_runs | Where-Object { $_.conclusion -eq 'success' } | Select-Object -ExpandProperty head_branch | Get-Unique)"
            exit 1
          }
        } catch {
          Write-Host "Error fetching UAT runs: $_"
          exit 1
        }

    - name: Download Solution Artifact from UAT
      run: |
        $runId = "${{ steps.find_uat_run.outputs.run_id }}"
        $artifactName = "solution-package-v$runId"
        
        Write-Host "Downloading artifact: $artifactName from run: $runId"
        
        $headers = @{
          'Authorization' = "Bearer ${{ secrets.GITHUB_TOKEN }}"
          'Accept' = 'application/vnd.github.v3+json'
        }
        
        # List artifacts for the run
        $artifactsUri = "https://api.github.com/repos/${{ github.repository }}/actions/runs/$runId/artifacts"
        $artifacts = Invoke-RestMethod -Uri $artifactsUri -Headers $headers -Method Get
        
        $artifact = $artifacts.artifacts | Where-Object { $_.name -eq $artifactName }
        
        if ($artifact) {
          Write-Host "Found artifact: $($artifact.name)"
          $downloadUri = $artifact.archive_download_url
          
          # Download the artifact zip
          Invoke-WebRequest -Uri $downloadUri -Headers $headers -OutFile "${{ runner.temp }}/artifact.zip"
          
          # Extract to out directory
          Expand-Archive -Path "${{ runner.temp }}/artifact.zip" -DestinationPath "out" -Force
          Write-Host "Artifact extracted to out directory"
        } else {
          Write-Host "Error: Artifact '$artifactName' not found in run $runId"
          Write-Host "Available artifacts: $($artifacts.artifacts | ForEach-Object { $_.name })"
          exit 1
        }
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Import Solution
      uses: microsoft/powerplatform-actions/import-solution@v1
      with:
        environment-url: 'https://org21989145.crm.dynamics.com'
        app-id: ${{ secrets.CLIENT_ID }}
        client-secret: ${{ secrets.CLIENT_SECRET }}
        tenant-id: ${{ secrets.TENANT_ID }}
        solution-file: 'out/aSolution_packed.zip'
        force-overwrite: true
        publish-changes: true

    - name: Publish Solution
      uses: microsoft/powerplatform-actions/publish-solution@v1
      with:
        environment-url: 'https://org21989145.crm.dynamics.com'
        app-id: ${{ secrets.CLIENT_ID }}
        client-secret: ${{ secrets.CLIENT_SECRET }}
        tenant-id: ${{ secrets.TENANT_ID }}

    - name: Deployment Success Notification
      if: success()
      run: |
        Write-Host "✓ Deployment to PROD completed successfully!" -ForegroundColor Green
        Write-Host "PR #${{ github.event.pull_request.number }}" -ForegroundColor Cyan
        Write-Host "Merged by: ${{ github.event.pull_request.merged_by.login }}" -ForegroundColor Cyan
        Write-Host "Solution Version: v${{ steps.find_uat_run.outputs.run_id }}" -ForegroundColor Yellow

    - name: Deployment Failed Notification
      if: failure()
      run: |
        Write-Host "✗ Deployment to PROD failed!" -ForegroundColor Red
        Write-Host "Please check the logs for details" -ForegroundColor Yellow
        exit 1
